# ═══════════════════════════════════════════════════════════════════════════════
# Responses API 中转转发服务 — 配置文件模板
# ═══════════════════════════════════════════════════════════════════════════════
# 复制为 responses_relay.toml 并按需修改，然后通过环境变量
# RESPONSES_RELAY_CONFIG 指定路径启动：
#   RESPONSES_RELAY_CONFIG=config/responses_relay.toml cargo run --bin responses_relay
#
# 所有字段均可通过环境变量覆盖（见 README_RESPONSES_RELAY.md）。
# ═══════════════════════════════════════════════════════════════════════════════

# ── 基本配置 ────────────────────────────────────────────────────────────────

# 监听地址（限制为本机以保安全；如需对外暴露改为 0.0.0.0 并配合反向代理鉴权）
host = "127.0.0.1"

# 监听端口
port = 8046

# 上游 Responses API 基础 URL（不要带尾部 /v1）
upstream_url = "https://api.openai.com"

# 上游 API Key（也可通过请求体 api_key 字段逐请求覆盖）
api_key = "sk-your-upstream-api-key"

# 默认模型名称（当请求体未指定 model 时使用）
default_model = "gpt-4o"

# ── 会话上下文（多轮工具调用关键，v2 新增）─────────────────────────────────
# Responses API 依靠 response_id / previous_response_id 维持连续多轮工具调用链路。
# 网关为每条下游会话缓存上一个 response_id，并在下一轮请求时注入
# previous_response_id + 增量 input，防止上下文断裂导致模型无法发起新一轮调用。
#
# context_mode 取值：
#   "response_id"（默认，推荐）— 多轮续接；若上游拒绝 previous_response_id，
#        网关会自动清除该会话缓存并以全量模式重试一次
#   "full" — 全量无状态模式（每轮携带完整 messages，兼容不支持续接的上游）
context_mode = "response_id"

# 会话上下文缓存上限（条目数）。每条 = 一个客户端会话（按 model + 首条 user 内容标识）。
# 超出后按插入顺序淘汰最旧会话。内存占用可忽略，保持默认即可。
max_session_contexts = 1024

# ── 超时与心跳配置（连接稳定性关键）─────────────────────────────────────────
# 以下参数解决长任务（多轮工具调用 Agent）被网关/反向代理切断的问题。

# 上游连接超时（秒）：建立 TCP+TLS 连接的最大等待时间
connect_timeout_secs = 30

# 上游读取超时（秒）：单次读取上游 SSE 流的墙钟上限。
# 注意：这是 reqwest 客户端的整体超时，会覆盖整个流式读取过程。
# 生成类模型长推理+多轮工具调用可能超过 5 分钟，务必设大。
read_timeout_secs = 600

# 整体会话最大时长（秒）：单个 /v1/chat/completions 请求从开始到结束的上限。
# 超过后强制发送 finish 分片并优雅关闭，避免无限挂起。
# 默认 600s（10 分钟），长任务可调大到 1800（30 分钟）。
session_max_duration_secs = 600

# SSE 空闲保活心跳间隔（秒）：当上游长时间无数据推送时，
# 定时向下游发送 ": ping\n\n" 注释心跳分片，防止反向代理/网关
# 判定空闲而切断 TCP 连接。建议 10~30s。
# 注意：心跳只刷新「活动计时」，不会推迟「空闲超时」判定，死流仍会被清理。
heartbeat_interval_secs = 15

# 首次分片超时（秒）：等待上游推送第一个有效分片的最大时间。
# 推理模型或缓冲型中继可能需较久才出首片，默认 120s。
first_chunk_timeout_secs = 120

# 分片空闲超时（秒）：相邻两个有效分片之间的最大间隔。
# 模型"思考"或中继缓冲时可能长时间无输出，默认 300s（5 分钟）。
chunk_idle_timeout_secs = 300
