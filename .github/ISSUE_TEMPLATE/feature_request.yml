name: ✨ 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述清楚你期望的功能。
  - type: textarea
    id: problem
    attributes:
      label: 背景与动机
      description: 你遇到了什么问题，或希望在什么场景下使用该功能？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的功能
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过其他方案吗？（可选）
  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
