name: 🐛 Bug 报告
description: 提交一个问题反馈，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量提供完整信息，方便我们快速定位问题。
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 应用的版本号（设置页可见），如 5.2.11
      placeholder: "5.2.11"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 操作系统
      description: 你运行在哪个系统上？
      options:
        - Windows
        - macOS (Intel)
        - macOS (Apple Silicon)
        - Linux
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？你期望的结果是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题？步骤越详细越好。
      placeholder: |
        1. 打开设置页
        2. 点击 ...
        3. 看到错误 ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 报错信息
      description: 调试控制台或终端中的报错信息（如有）
      render: shell
  - type: dropdown
    id: impact
    attributes:
      label: 影响程度
      options:
        - 崩溃 / 无法使用
        - 功能异常
        - 轻微问题 / 界面瑕疵
        - 其他
  - type: checkboxes
    id: terms
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
