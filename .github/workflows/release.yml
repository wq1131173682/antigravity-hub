name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev libxkbcommon-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        # createUpdaterArtifacts is false in tauri.conf.json; signing is done
        # separately by scripts/sign_updater.py so we do NOT pass a key here.
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error

  updater:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pynacl
        run: pip install pynacl

      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Sign bundles and generate updater.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          python scripts/sign_updater.py \
            --tag "${GITHUB_REF_NAME}" \
            --bundle-dir bundles \
            --out updater.json \
            --verify \
            --notes "Release ${GITHUB_REF_NAME}"

      - name: Remove any existing release for this tag (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes 2>/dev/null || true
          sleep 5

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1) Create the release with updater.json only (keeps the release alive
          #    even if a later asset upload fails).
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}" \
            --latest \
            updater.json

          # 2) Upload only the real installer artifacts (icons/wixpdb/.sig are
          #    not needed by the updater and some of them 404 on upload).
          #    A single failing file must not abort the whole release.
          find bundles -type f \( \
            -name "*.msi" -o -name "*.exe" -o \
            -name "*.AppImage" -o -name "*.deb" \) -print0 | \
          while IFS= read -r -d '' f; do
            echo "uploading: $f"
            gh release upload "${GITHUB_REF_NAME}" "$f" --clobber || \
              echo "  WARN: failed to upload $f (ignored)"
          done
          echo "publish step done"
