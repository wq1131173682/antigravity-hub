name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: "stable"
  CARGO_INCREMENTAL: 0

jobs:
  # ── Extract version (used by all jobs) ────────────────────────────────────
  release-meta:
    name: Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | awk '{print $3}' | tr -d '"')
          echo "VERSION=v${VERSION}" >> $GITHUB_OUTPUT

  # ── Windows Build ──────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    needs: [release-meta]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install llvm (required by Rust on Windows)
        run: choco install llvm -y --no-progress

      - name: Install WebView2 (official Microsoft Edge runtime)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # Use the stable channel WebView2 bootstrap installer
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:TEMP\WebView2Setup.exe"
          Start-Process "$env:TEMP\WebView2Setup.exe" -ArgumentList "/silent", "/install" -Wait

      - name: npm ci (with legacy peer deps for @lobehub/icons compatibility)
        run: npm ci --legacy-peer-deps

      - name: Build Tauri app (Windows)
        run: npx tauri build

      - name: Upload NSIS setup.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.version }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

      - name: Upload MSI
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.version }}
          files: src-tauri/target/release/bundle/msi/*.msi
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

  # ── macOS Build ────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (universal)
    needs: [release-meta]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: npm ci (with legacy peer deps for @lobehub/icons compatibility)
        run: npm ci --legacy-peer-deps

      - name: Build Tauri app (macOS universal)
        run: npx tauri build

      - name: Upload .dmg
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.version }}
          files: src-tauri/target/release/bundle/dmg/*.dmg
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

  # ── Linux Build ────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (x64)
    needs: [release-meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator-dev libvips-dev

      - name: npm ci (with legacy peer deps for @lobehub/icons compatibility)
        run: npm ci --legacy-peer-deps

      - name: Build Tauri app (Linux)
        run: npx tauri build

      - name: Upload .deb
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.version }}
          files: src-tauri/target/release/bundle/deb/*.deb
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

      - name: Upload AppImage
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.version }}
          files: src-tauri/target/release/bundle/appimage/*.AppImage
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true

  # ── Publish Release (after all platforms succeed) ──────────────────────────
  publish:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux, release-meta]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-meta.outputs.version }}
          publish: true
          token: ${{ secrets.GITHUB_TOKEN }}
