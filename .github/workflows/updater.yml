name: Updater

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: updater-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

env:
  NODE_VERSION: "22"
  # Tauri updater platforms map to OS/distro identifiers
  # See: https://tauri.app/distribute/updater/#platform-identifiers
  TAURI_PLATFORMS_WIN: "windows-x64"
  TAURI_PLATFORMS_LINUX_GNOME: "linux-gnome"
  TAURI_PLATFORMS_LINUX_APPIMAGE: "linux-appimage"
  TAURI_PLATFORMS_MACOS: "darwin"

jobs:
  # Build updater.json for Tauri's built-in auto-update mechanism.
  # This file is downloaded by the app from:
  #   https://github.com/wq1131173682/antigravity-hub/releases/latest/download/updater.json
  generate-updater-manifest:
    name: Generate Updater Manifest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag_name: ${{ steps.tag.outputs.TAG_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | awk '{print $3}' | tr -d '"')
          echo "VERSION=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="v$(grep '^version' src-tauri/Cargo.toml | head -1 | awk '{print $3}' | tr -d '\"')"
          else
            # Extract tag from workflow_run event
            TAG_NAME="${{ github.event.workflow_run.head_branch }}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/release-assets
          gh release download "${{ steps.tag.outputs.TAG_NAME }}" \
            --dir /tmp/release-assets --clobber || true
          ls -la /tmp/release-assets/

      - name: Build and sign updater.json
        # Reuse the exact same signing key + password as the Release build.
        # `tauri signer sign` reads TAURI_SIGNING_PRIVATE_KEY (base64) and
        # TAURI_SIGNING_PRIVATE_KEY_PASSWORD from the environment, exactly like
        # the Release pipeline does for the binaries. This avoids the fragile
        # base64/manisign CLI handling and the interactive password prompt.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          GH_URL="https://github.com/wq1131173682/antigravity-hub/releases/download/${TAG}"

          # Collect available assets
          NSIS=""
          MSI=""
          DMG=""
          APPIMAGE=""
          DEB=""

          for f in /tmp/release-assets/*; do
            base=$(basename "$f")
            url="${GH_URL}/${base}"
            case "$base" in
              *.exe)       NSIS="$url" ;;
              *.msi)       MSI="$url" ;;
              *.dmg)       DMG="$url" ;;
              *.AppImage)  APPIMAGE="$url" ;;
              *.deb)       DEB="$url" ;;
            esac
          done

          # Write updater.json template (no signature yet)
          cat > updater.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "${TAURI_PLATFORMS_WIN}": {
                "signature": "",
                "url": "${NSIS}"
              },
              "${TAURI_PLATFORMS_LINUX_GNOME}": {
                "signature": "",
                "url": "${DEB}"
              },
              "${TAURI_PLATFORMS_LINUX_APPIMAGE}": {
                "signature": "",
                "url": "${APPIMAGE}"
              },
              "${TAURI_PLATFORMS_MACOS}": {
                "signature": "",
                "url": "${DMG}"
              }
            }
          }
          EOF

          echo "Generated updater.json (before signing):"
          cat updater.json

          # Sign updater.json with the same key used to sign the release binaries.
          # `tauri signer sign` emits a minisign-compatible signature to <file>.sig.
          npx -y @tauri-apps/cli@2.10.0 signer sign updater.json

          echo "Signature file created:"
          cat updater.json.sig

          # `tauri signer sign` writes a base64-encoded signature to updater.json.sig.
          # The Tauri updater expects the *plaintext* minisign signature (multi-line)
          # in the per-platform `signature` field, so base64-decode it first.
          base64 -d updater.json.sig > /tmp/updater.sig.plain

          # Embed the decoded plaintext signature (avoids shell var-expansion pitfalls)
          python3 -c "
          import json
          with open('/tmp/updater.sig.plain') as f:
              sig = f.read()
          with open('updater.json') as f:
              data = json.load(f)
          for platform in data['platforms']:
              data['platforms'][platform]['signature'] = sig
          with open('updater.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          # Keep the .minisig artifact name for consistency with prior uploads
          cp updater.json.sig updater.json.minisig

          echo "Final updater.json:"
          cat updater.json

      - name: Upload updater files to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          files: |
            updater.json
            updater.json.minisig
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
