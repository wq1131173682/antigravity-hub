name: Updater

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: updater-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

env:
  NODE_VERSION: "22"
  MINISIGN_VERSION: "0.12"
  # Tauri updater platforms map to OS/distro identifiers
  # See: https://tauri.app/distribute/updater/#platform-identifiers
  TAURI_PLATFORMS_WIN: "windows-x64"
  TAURI_PLATFORMS_LINUX_GNOME: "linux-gnome"
  TAURI_PLATFORMS_LINUX_APPIMAGE: "linux-appimage"
  TAURI_PLATFORMS_MACOS: "darwin"

jobs:
  # Build updater.json for Tauri's built-in auto-update mechanism.
  # This file is downloaded by the app from:
  #   https://github.com/wq1131173682/antigravity-hub/releases/latest/download/updater.json
  generate-updater-manifest:
    name: Generate Updater Manifest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag_name: ${{ steps.tag.outputs.TAG_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | awk '{print $3}' | tr -d '"')
          echo "VERSION=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Determine tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="v$(grep '^version' src-tauri/Cargo.toml | head -1 | awk '{print $3}' | tr -d '\"')"
          else
            # Extract tag from workflow_run event
            TAG_NAME="${{ github.event.workflow_run.head_branch }}"
          fi
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Download minisign binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/minisign
          gh release download "${MINISIGN_VERSION}" \
            --repo jedisct1/minisign \
            --pattern "minisign-0.12-linux.tar.gz" \
            -D /tmp/minisign --clobber

      - name: Extract minisign
        run: |
          cd /tmp/minisign
          tar xzf minisign-0.12-linux.tar.gz
          # Binary is at minisign-linux/x86_64/minisign on Linux runners
          cp minisign-linux/x86_64/minisign .
          rm -rf minisign-linux
          chmod +x minisign
          ./minisign -v

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/release-assets
          gh release download "${{ steps.tag.outputs.TAG_NAME }}" \
            --dir /tmp/release-assets --clobber || true
          ls -la /tmp/release-assets/

      - name: Build updater.json with minisign signature
        env:
          MINISIGN_PRIVKEY: ${{ secrets.MINISIGN_PRIVKEY }}
          MINISIGN_PRIVKEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.tag.outputs.TAG_NAME }}"
          GH_URL="https://github.com/wq1131173682/antigravity-hub/releases/download/${TAG}"

          # Strip whitespace from the secret and base64-decode to get the raw rsign key
          printf '%s' "$MINISIGN_PRIVKEY" | tr -d '[:space:]' | base64 -d > /tmp/minisign.key
          echo "Private key content:"
          cat /tmp/minisign.key

          # Collect available assets
          NSIS=""
          MSI=""
          DMG=""
          APPIMAGE=""
          DEB=""

          for f in /tmp/release-assets/*; do
            base=$(basename "$f")
            url="${GH_URL}/${base}"
            case "$base" in
              *.exe)       NSIS="$url" ;;
              *.msi)       MSI="$url" ;;
              *.dmg)       DMG="$url" ;;
              *.AppImage)  APPIMAGE="$url" ;;
              *.deb)       DEB="$url" ;;
            esac
          done

          # Write updater.json template (no signature yet)
          cat > updater.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "${TAURI_PLATFORMS_WIN}": {
                "signature": "",
                "url": "${NSIS}"
              },
              "${TAURI_PLATFORMS_LINUX_GNOME}": {
                "signature": "",
                "url": "${DEB}"
              },
              "${TAURI_PLATFORMS_LINUX_APPIMAGE}": {
                "signature": "",
                "url": "${APPIMAGE}"
              },
              "${TAURI_PLATFORMS_MACOS}": {
                "signature": "",
                "url": "${DMG}"
              }
            }
          }
          EOF

          echo "Generated updater.json (before signing):"
          cat updater.json

          # Sign the updater.json with minisign (password via stdin for rsign encrypted key)
          echo "$MINISIGN_PRIVKEY_PASSWORD" | /tmp/minisign/minisign -S \
            -s /tmp/minisign.key \
            -m updater.json \
            -x updater.json.minisig

          echo "Signature created:"
          cat updater.json.minisig

          # Read signature and embed into updater.json
          SIG=$(cat updater.json.minisig)
          python3 -c "
          import json, sys
          with open('updater.json') as f:
              data = json.load(f)
          for platform in data['platforms']:
              data['platforms'][platform]['signature'] = '''${SIG}'''
          with open('updater.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          echo "Final updater.json:"
          cat updater.json

      - name: Upload updater files to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          files: |
            updater.json
            updater.json.minisig
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
